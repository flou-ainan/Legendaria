[project]
name = "legendaria"
version = "0.1.0.dev2"
description = "Legendária transcription engine: local Whisper transcription with word timings (CLI: flosub)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "flou-ainan" }]
requires-python = ">=3.10"
keywords = ["subtitles", "captions", "whisper", "transcription", "srt", "vtt"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "faster-whisper>=1.2,<2",
    "platformdirs>=4",
]

[project.optional-dependencies]
# NVIDIA GPU acceleration (Linux / Windows). The installer adds this extra when an NVIDIA GPU is found.
cuda = [
    "nvidia-cublas-cu12>=12.1; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'linux' or sys_platform == 'win32'",
]
test = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
flosub = "legendaria_engine.cli:main"

[project.urls]
Homepage = "https://github.com/flou-ainan/Legendaria"
Issues = "https://github.com/flou-ainan/Legendaria/issues"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["legendaria_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
