name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"

      - name: Lint and format (pre-commit)
        run: uvx pre-commit@4.6.2 run --all-files --show-diff-on-failure

      - name: Engine tests
        if: hashFiles('engine/pyproject.toml') != ''
        working-directory: engine
        run: uv run --extra test pytest

      - name: Add-on tests (pure Python)
        run: uvx --python 3.11 pytest blender_addon/tests

  blender:
    name: blender (${{ matrix.blender }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - blender: "4.2.23"
            series: "4.2"
          - blender: "5.2.3"
            series: "5.2"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"

      - name: Install the engine (CPU) as flosub
        run: uv tool install ./engine

      - name: Cache Blender
        id: cache
        uses: actions/cache@v5.1.0
        with:
          path: ~/blender
          key: blender-${{ matrix.blender }}-linux-x64

      - name: Download Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          base=https://download.blender.org/release/Blender${{ matrix.series }}
          file=blender-${{ matrix.blender }}-linux-x64.tar.xz
          curl -sSfLO "$base/$file"
          curl -sSfL "$base/blender-${{ matrix.blender }}.sha256" | grep linux-x64.tar.xz | sha256sum -c -
          tar -xf "$file" -C ~/blender --strip-components=1

      - name: System libraries for Blender
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libice6 libegl1

      - name: Test audio clip
        run: |
          python3 - <<'PY'
          import math, struct, wave
          with wave.open("clip.wav", "wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000)
              w.writeframes(b"".join(struct.pack("<h", int(8000 * math.sin(i / 20))) for i in range(48000)))
          PY

      - name: Add-on smoke test inside Blender
        run: ~/blender/blender -b --factory-startup --python-exit-code 1 --python blender_addon/tests/blender_smoke.py -- --media clip.wav

      - name: Build the extension package
        run: |
          mkdir -p dist
          ~/blender/blender --factory-startup --command extension build --source-dir blender_addon/legendaria --output-dir dist

  # Single required status check for branch protection.
  ci:
    name: ci
    if: always()
    needs: [checks, blender]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        if: needs.checks.result != 'success' || needs.blender.result != 'success'
        run: exit 1
