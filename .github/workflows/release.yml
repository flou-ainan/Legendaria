name: Release

# Publishes the engine (PyPI package "legendaria") when a version tag is pushed.
# PyPI trusts this workflow through Trusted Publishing: no tokens or passwords are stored.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"

      - name: Check that the tag matches the engine version
        working-directory: engine
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match engine version $version" >&2
            exit 1
          fi

      - name: Test
        working-directory: engine
        run: uv run --extra test pytest

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Build the web editor (into engine/legendaria_engine/web)
        working-directory: web
        run: npm ci && npm run build

      - name: Build sdist and wheel
        working-directory: engine
        run: uv build --out-dir ../dist

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/legendaria/
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.2
